    <style>
      :root { color-scheme: light; --violet:#5760a8; --violet-dark:#414a8e; --ink:#24243a; --muted:#606174; --paper:#f7f7fb; --line:#dedfec; }

      html { min-width:280px; -webkit-text-size-adjust:100%; }

      .social:hover { background:#e9ebf6; border-color:var(--violet); }
      .social.primary:hover { background:var(--violet-dark); }
      .social svg { width:15px; height:15px; flex:none; }
      a:focus-visible { outline:3px solid var(--violet-dark); outline-offset:5px; }
      .symbol { display:grid; place-items:center; min-width:0; }
      .symbol img { display:block; width:min(100%,320px); height:auto; opacity:.78; }
      footer { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px 26px; border-top:1px solid var(--line); padding-top:22px; color:var(--muted); font-size:13px; line-height:1.5; }
